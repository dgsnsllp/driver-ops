# ============================================
# Driver Ops - Docker Compose
# Frontend + Backend + MongoDB
# ============================================

services:
  # --- MongoDB ---
  mongodb:
    image: mongo:7
    container_name: driverops-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-driverops}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-driverops123}
      MONGO_INITDB_DATABASE: driverops
    volumes:
      - mongodb_data:/data/db
    networks:
      - driverops-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Backend (Node.js + Express) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driverops-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USERNAME:-driverops}:${MONGO_PASSWORD:-driverops123}@mongodb:27017/driverops?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-driverops-secret-key-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - driverops-network

  # --- Frontend (React + Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
    container_name: driverops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - driverops-network

volumes:
  mongodb_data:
    driver: local

networks:
  driverops-network:
    driver: bridge
